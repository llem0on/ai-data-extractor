      <text x="220" y="262" font-size="12" fill="#71717a" text-anchor="middle">by file type</text>
    </g>

    <g>
      <rect x="322" y="74" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <circle cx="370" cy="110" r="18" fill="none" stroke="#0ea5e9" stroke-width="3"/>
      <path d="M352 110 h36 M370 92 c-8 10 -8 26 0 36 c8 -10 8 -26 0 -36" stroke="#0ea5e9" stroke-width="2.2" fill="none"/>
