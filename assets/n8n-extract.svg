      <text x="370" y="182" font-size="12" fill="#71717a" text-anchor="middle">text + line markers</text>
    </g>

    <g>
      <rect x="322" y="234" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
