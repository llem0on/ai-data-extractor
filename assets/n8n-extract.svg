<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="470" viewBox="0 0 1320 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#d4d4d8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="1320" height="470" rx="16" fill="#f4f4f5"/>
  <rect width="1320" height="470" rx="16" fill="url(#dots)"/>
  <text x="28" y="40" font-size="18" font-weight="700" fill="#18181b">Extract Data</text>
  <text x="28" y="62" font-size="13" fill="#71717a">POST /webhook/extract · sync, returns the extracted fields as JSON</text>

  <g transform="translate(0 40)">
    <g stroke="#9ca3af" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M128 190 H170"/>
      <path d="M268 182 C295 182 295 110 320 110"/>
      <path d="M268 198 C295 198 295 270 320 270"/>
      <path d="M418 110 C445 110 445 182 470 182"/>
      <path d="M418 270 C445 270 445 198 470 198"/>
      <path d="M568 190 H610"/>
      <path d="M708 182 C734 182 734 110 758 110"/>
      <path d="M708 198 C722 198 722 330 770 330"/>
      <path d="M900 110 H940"/>
      <path d="M1038 110 H1070"/>
      <path d="M1168 110 C1186 110 1186 182 1200 182"/>
      <path d="M868 330 C1100 330 1150 198 1200 198"/>
    </g>
    <g stroke="#a1a1aa" stroke-width="2" stroke-dasharray="5 5" fill="none">
      <path d="M795 204 V146"/>
      <path d="M875 204 V146"/>
    </g>
    <g font-size="12" font-weight="600" fill="#71717a">
      <text x="716" y="148">true</text>
      <text x="716" y="246">false</text>
    </g>

    <g>
      <path d="M68 154 H114 A14 14 0 0 1 128 168 V212 A14 14 0 0 1 114 226 H68 A36 36 0 0 1 68 154 Z" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
