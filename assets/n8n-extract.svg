      <text x="80" y="262" font-size="12" fill="#71717a" text-anchor="middle">PDF or DOCX</text>
    </g>

    <g>
      <rect x="172" y="154" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
