      <text x="875" y="236" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#db2777" text-anchor="middle">{ }</text>
      <text x="875" y="274" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">Output Parser</text>
      <text x="875" y="290" font-size="11" fill="#71717a" text-anchor="middle">JSON schema</text>
    </g>

    <g>
      <rect x="942" y="74" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <text x="990" y="117" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#f97316" text-anchor="middle">&lt;/&gt;</text>
      <text x="990" y="166" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Code</text>
      <text x="990" y="182" font-size="12" fill="#71717a" text-anchor="middle">derive department</text>
    </g>

    <g>
      <rect x="1072" y="74" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <g fill="#64748b">
        <rect x="1100" y="96" width="40" height="6" rx="3"/>
        <rect x="1100" y="107" width="30" height="6" rx="3"/>
        <rect x="1100" y="118" width="36" height="6" rx="3"/>
      </g>
      <text x="1120" y="166" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Edit Fields</text>
      <text x="1120" y="182" font-size="12" fill="#71717a" text-anchor="middle">final shape</text>
    </g>

    <g>
      <rect x="772" y="294" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <circle cx="820" cy="330" r="15" fill="none" stroke="#64748b" stroke-width="3"/>
      <path d="M809 341 L831 319" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      <text x="820" y="386" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Empty Result</text>
      <text x="820" y="402" font-size="12" fill="#71717a" text-anchor="middle">unreadable: true</text>
    </g>

    <g>
      <path d="M1216 154 H1262 A36 36 0 0 1 1262 226 H1216 A14 14 0 0 1 1202 212 V168 A14 14 0 0 1 1216 154 Z" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <path d="M1230 190 h40 M1258 178 l12 12 l-12 12" stroke="#22c55e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1250" y="246" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Respond</text>
      <text x="1250" y="262" font-size="12" fill="#71717a" text-anchor="middle">JSON fields</text>
    </g>
