      <text x="660" y="262" font-size="12" fill="#71717a" text-anchor="middle">scanned file = empty</text>
    </g>

    <g>
      <rect x="760" y="74" width="140" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <rect x="816" y="96" width="28" height="22" rx="6" fill="none" stroke="#db2777" stroke-width="3"/>
      <circle cx="825" cy="107" r="2.6" fill="#db2777"/>
      <circle cx="835" cy="107" r="2.6" fill="#db2777"/>
      <path d="M830 96 v-8" stroke="#db2777" stroke-width="3" stroke-linecap="round"/>
      <circle cx="830" cy="86" r="3" fill="#db2777"/>
      <text x="830" y="62" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">AI Agent</text>
      <text x="830" y="46" font-size="12" fill="#71717a" text-anchor="middle">header fields only</text>
    </g>

    <g>
      <circle cx="795" cy="230" r="26" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <text x="795" y="235" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">LLM</text>
      <text x="795" y="274" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">Chat Model</text>
      <text x="795" y="290" font-size="11" fill="#71717a" text-anchor="middle">temperature 0</text>
    </g>

    <g>
