      <text x="370" y="342" font-size="12" fill="#71717a" text-anchor="middle">header + tables</text>
    </g>

    <g>
      <rect x="472" y="154" width="96" height="72" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <path d="M498 176 q16 0 22 14 M498 204 q16 0 22 -14 M520 190 h18" stroke="#0891b2" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <text x="520" y="246" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Merge</text>
    </g>

    <g>
